name: CI - Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  android-test:
    # Los mismos tests que corre quien revisa (JUnit 4 + coroutines-test, sin emulador) y que la app compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Solo platform-tools: el paquete por defecto (tools) ya no existe. El SDK 37 lo baja AGP solo
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests y build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Reporte de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: app/build/reports/tests/
